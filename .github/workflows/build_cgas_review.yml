name: build-cgas-review
on:
  push:
    branches:
      - chatgpt-cgas-sting-review-20260919
    paths:
      - automation/build_cgas_highimpact_review.py
      - .github/workflows/build_cgas_review.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-cgas-sting-review-20260919
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-docx cairosvg pillow
      - run: python automation/build_cgas_highimpact_review.py
      - name: Commit generated Word
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt_exports/cGAS-STING_Autoimmune_Review_HighImpact_Benchmark_Final_CN.docx
          git diff --cached --quiet || git commit -m "Build high-impact cGAS-STING autoimmune review Word"
          git push origin HEAD:chatgpt-cgas-sting-review-20260919
