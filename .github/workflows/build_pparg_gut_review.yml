
name: build-pparg-gut-review
on:
  push:
    branches:
      - chatgpt-pparg-gut-review-20260920
    paths:
      - automation/build_pparg_gut_review.py
      - .github/workflows/build_pparg_gut_review.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-pparg-gut-review-20260920
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-docx matplotlib pillow
      - run: python automation/build_pparg_gut_review.py
      - name: Commit generated Word and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt_exports/PPARG_Gut_Related_Diseases_Review_Framework_Figures_Tables_CN.docx chatgpt_exports/pparg_figures
          git diff --cached --quiet || git commit -m "Build PPARG gut review Word with figures and tables"
          git push origin HEAD:chatgpt-pparg-gut-review-20260920
