name: build-ophthalmic-radiomics-review
on:
  push:
    branches:
      - chatgpt-ophthalmic-radiomics-review-20261008
    paths:
      - automation/build_ophthalmic_radiomics_review.py
      - .github/workflows/build_ophthalmic_radiomics_review.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ophthalmic-radiomics-review-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-docx matplotlib numpy pillow
      - name: Build review Word
        run: |
          mkdir -p chatgpt_exports
          python automation/build_ophthalmic_radiomics_review.py > chatgpt_exports/build_ophthalmic_radiomics_review.log 2>&1 || true
      - name: Commit output and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt_exports/build_ophthalmic_radiomics_review.log
          [ -d chatgpt_exports/ophthalmic_radiomics_assets ] && git add chatgpt_exports/ophthalmic_radiomics_assets || true
          [ -f "chatgpt_exports/影像组学与眼科疾病_高影响力综述框架_图表整合版.docx" ] && git add "chatgpt_exports/影像组学与眼科疾病_高影响力综述框架_图表整合版.docx" || true
          git diff --cached --quiet || git commit -m "Build ophthalmic radiomics review Word"
          git push origin HEAD:chatgpt-ophthalmic-radiomics-review-20261008
